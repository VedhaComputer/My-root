name: CI Pipeline

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]

jobs:
  backend:
    name: Backend Lint, Test & Coverage
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout Code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node.js 20.x
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: '20.x'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Start Standalone MongoDB (Port 27017)
        run: |
          docker run -d --name mongodb-standalone -p 27017:27017 mongo:7.0 --port 27017
          until docker exec mongodb-standalone mongosh --port 27017 --eval "db.adminCommand('ping')" --quiet; do
            echo "Waiting for standalone MongoDB on 27017..."
            sleep 1
          done
          echo "Standalone MongoDB ready on 27017"

      - name: Start Replica Set MongoDB (Port 27018)
        run: |
          docker run -d --name mongodb-replicaset -p 27018:27018 mongo:7.0 --replSet rs0 --port 27018 --bind_ip_all
          until docker exec mongodb-replicaset mongosh --port 27018 --eval "db.adminCommand('ping')" --quiet; do
            echo "Waiting for replica set container on 27018..."
            sleep 1
          done
          docker exec mongodb-replicaset mongosh --port 27018 --eval "rs.initiate({_id: 'rs0', members: [{_id: 0, host: '127.0.0.1:27018'}]})"
          until docker exec mongodb-replicaset mongosh --port 27018 --eval "db.adminCommand({ hello: 1 }).isWritablePrimary" --quiet | grep -q "true"; do
            echo "Waiting for replica set rs0 primary election..."
            sleep 1
          done
          echo "Replica set rs0 ready on 27018 with writable primary"

      - name: Install Dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Run Production Dependency Audit (Mandatory)
        run: npm audit --audit-level=high --omit=dev

      - name: Report Development Dependency Audit (Informational)
        run: npm audit --audit-level=high
        continue-on-error: true

      - name: Run Tests with Coverage
        run: npm run test:coverage
        env:
          NODE_ENV: test
          MONGODB_URI: mongodb://localhost:27017/myroot_test
          JWT_ACCESS_SECRET: test_access_secret_minimum_32_characters_long
          JWT_REFRESH_SECRET: test_refresh_secret_minimum_32_characters_long
          PORT: 3002
          CORS_ORIGINS: http://localhost:3000

      - name: Upload Backend Coverage Report
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        if: always()
        with:
          name: backend-coverage-report
          path: backend/coverage/
          retention-days: 14

      - name: Stop and Cleanup MongoDB Containers
        if: always()
        run: |
          docker rm -f mongodb-standalone mongodb-replicaset || true

  frontend:
    name: Frontend Analyze & Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout Code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Flutter
        uses: subosito/flutter-action@f2c4f6686ca8e8d6e6d0f28410eeef506ed66aff # v2.18.0
        with:
          flutter-version: '3.x'
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Analyze Flutter Code
        run: flutter analyze

      - name: Run Flutter Tests
        run: flutter test

      - name: Upload Frontend Test Results
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        if: always()
        with:
          name: frontend-test-results
          path: frontend/test/
          retention-days: 14

  security:
    name: Security Scans (Gitleaks, Semgrep & Trivy)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Run Gitleaks Secret Scanner
        uses: gitleaks/gitleaks-action@f586c14365d4643c6aa59d472ae6e984bf47bb34 # v2.3.8
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Run Semgrep SAST Scanner
        uses: semgrep/semgrep-action@713efdd345f3035192eaa63f56867b88e63e4e5d # v1
        with:
          config: >-
            p/security-audit
            p/owasp-top-ten
            p/javascript
            p/typescript

      - name: Build Backend Container Image for Security Scanning
        run: docker build -t myroot-backend:ci -f backend/Dockerfile backend

      - name: Run Trivy Container Image Vulnerability Scanner
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # 0.35.0
        with:
          image-ref: 'myroot-backend:ci'
          format: 'table'
          severity: 'CRITICAL,HIGH'
          ignore-unfixed: true
          exit-code: '1'

      - name: Run Trivy Filesystem & Config Scanner
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # 0.35.0
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'table'
          severity: 'CRITICAL,HIGH'
          ignore-unfixed: true
          exit-code: '1'
